[project]
name = "sql-analyst-agent"
version = "0.1.0"
description = "An agentic text-to-SQL analyst evaluated on BIRD: one-shot vs single agent vs multi-agent"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Alekh" }]
dependencies = [
    "anthropic>=1.9,<2",
    "mcp>=2.2,<3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
